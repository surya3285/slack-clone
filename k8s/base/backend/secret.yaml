# MONGO_URI credentials must match k8s/base/mongo/secret.yaml.
# This duplication is exactly what the Helm chart in k8s/helm avoids.
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: slack-clone
type: Opaque
stringData:
  MONGO_URI: "mongodb://root:changeme@mongo.slack-clone.svc.cluster.local:27017/slackclone?authSource=admin"
