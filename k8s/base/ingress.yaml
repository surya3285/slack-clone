# Assumes the ingress-nginx controller is installed in the cluster.
# Add "127.0.0.1 slack-clone.test" to /etc/hosts when running locally
# (point it at `minikube ip` instead of 127.0.0.1 if using minikube).
# Note: avoid ".local" hostnames on macOS - that TLD is reserved for
# Bonjour/mDNS and causes DNS resolution to hang instead of using
# /etc/hosts. ".test" is the IANA-reserved TLD for exactly this purpose.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: slack-clone
  namespace: slack-clone
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # Socket.io's handshake is stateful and tied to whichever backend pod
    # accepted the first request. With 2+ backend replicas, requests must
    # stick to the same pod or the handshake fails and the client loops
    # reconnecting forever.
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/affinity-mode: "persistent"
    nginx.ingress.kubernetes.io/session-cookie-name: "SLACKCLONESESSION"
spec:
  ingressClassName: nginx
  rules:
    - host: slack-clone.test
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 5000
          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 5000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
