mongo:
  storageClassName: gp3-csi

backend:
  image:
    repository: 778477254912.dkr.ecr.eu-north-1.amazonaws.com/slack-clone-backend
    tag: latest
    pullPolicy: Always

frontend:
  image:
    repository: 778477254912.dkr.ecr.eu-north-1.amazonaws.com/slack-clone-frontend
    tag: latest
    pullPolicy: Always

ingress:
  className: alb
  host: ""
  annotations:
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/target-group-attributes: stickiness.enabled=true,stickiness.type=lb_cookie,stickiness.lb_cookie.duration_seconds=86400
