mongo:
  image: mongo:7
  storage: 1Gi
  storageClassName: "" # empty = use the cluster's default StorageClass
  auth:
    username: root
    password: changeme
    database: slackclone
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

redis:
  image: redis:7-alpine
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

backend:
  image:
    repository: slack-clone-backend
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 2
  port: 5000
  # Demo secret only - override with --set backend.jwtSecret=... for anything beyond local learning.
  jwtSecret: "0b3398aa7d86dab356e20af36a5b2736f3fcdc71bda78080b28be615fc4816dd"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70

frontend:
  image:
    repository: slack-clone-frontend
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 2
  port: 80
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  service:
    type: ClusterIP

ingress:
  enabled: true
  className: nginx
  host: slack-clone.test
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/affinity-mode: "persistent"
    nginx.ingress.kubernetes.io/session-cookie-name: "SLACKCLONESESSION"

networkPolicy:
  enabled: true
