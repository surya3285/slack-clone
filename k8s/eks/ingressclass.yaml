# One-time cluster prerequisite for EKS Auto Mode's built-in ALB support -
# not part of the app's Helm chart since an IngressClass is cluster-scoped
# infrastructure, not something a single app should own.
apiVersion: eks.amazonaws.com/v1
kind: IngressClassParams
metadata:
  name: alb
spec:
  scheme: internet-facing
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: alb
spec:
  controller: eks.amazonaws.com/alb
  parameters:
    apiGroup: eks.amazonaws.com
    kind: IngressClassParams
    name: alb
